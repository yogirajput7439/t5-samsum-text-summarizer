<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>T5 Text Summarizer</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <div class="container">

        <h1>T5 Text Summarizer</h1>

        <p class="subtitle">
            AI-powered text summarization using Hugging Face T5
        </p>


        <div class="card">

            <label for="dialogue-input">
                Enter your text
            </label>

            <textarea
                id="dialogue-input"
                placeholder="Paste or write your text here..."
            ></textarea>


            <button id="summarize-btn">

                Summarize Text

            </button>


            <div id="loading" class="loading">

                Generating summary...

            </div>


            <div id="result">

                <h2>Summary</h2>

                <p id="summary-text"></p>

            </div>

        </div>

    </div>


    <script src="/static/script.js"></script>

</body>

</html>
